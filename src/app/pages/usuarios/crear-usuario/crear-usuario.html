<div class="newUserDiv">

    <div class="newUserHeader">
        <h2>Nuevo Usuario</h2>
    </div>
    
    <form [formGroup]="form" (submit)="crearUsuario()">
        
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" formControlName="name">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="text" name="email" formControlName="email">
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" name="password" formControlName="password">
        </div>
        <div>
            <label for="confirmar">Confirmar Password:</label>
            <input type="password" name="confirmar" formControlName="confirm">
        </div>
    
        <div>
            <label>
                <input type="checkbox" name="accept" formControlName="accept">Aceptar terminos y condiciones
            </label>
        </div>
    
        <div>
            <button [disabled]="form.invalid">Crear Usuario</button>
            <!-- Previene el comportamiento defautl del submit del button -->
            <button type="button">Cancelar</button>
        </div>
    
    </form>
</div>
