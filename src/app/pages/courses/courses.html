<h2>Lista de Cursos</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
        </tr>

    </thead>

    <tbody>
        @for (curso of cursos; track curso.id) {
            <tr>
                <td>{{curso.id}}</td>
                <td>
                    <a (click)="setCursoSeleccionado(curso)" [routerLink]="curso.id + ''">
                        {{curso.name}}
                    </a>
                </td>
            </tr>
        
        }
    </tbody>
</table>
